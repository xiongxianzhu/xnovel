name: 功能建议
description: 提议一个有明确用户价值的改进
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        请先说明用户问题，再描述解决方案。规划中的功能不代表已经承诺实现。

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - API
        - Web
        - Desktop（规划中）
        - AI 辅助
        - 文档
        - 仓库与工具链
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 谁在什么场景遇到了什么困难？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述最小可用方案，不需要提前设计所有未来能力。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 说明已经考虑过的其他办法，以及它们为什么不够合适。

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 使用可验证的结果描述功能何时算完成。
      placeholder: |
        - [ ] 用户可以……
        - [ ] 失败时……
    validations:
      required: true

  - type: textarea
    id: ai_boundary
    attributes:
      label: AI 与作者控制边界
      description: 涉及 AI 时说明作者如何确认建议，以及如何避免直接覆盖正文；不涉及时填写“不适用”。
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有找到相同建议。
          required: true
        - label: 我理解提交建议不代表项目承诺实现。
          required: true
