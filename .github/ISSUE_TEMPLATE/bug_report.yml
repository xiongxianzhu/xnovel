name: Bug 报告
description: 报告可以稳定复现的问题
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 xnovel。请勿提交密钥、访问令牌、私人小说正文或完整模型输入。

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - API
        - Web
        - Desktop
        - 文档
        - 仓库与工具链
        - 其他
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 简要说明发生了什么，以及它带来的影响。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 提供能够稳定复现问题的最小步骤。
      placeholder: |
        1. 打开……
        2. 输入……
        3. 点击……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 包括操作系统、浏览器、Python、Node.js、pnpm 或应用版本中与问题相关的信息。
      placeholder: |
        OS: Windows 11 x64
        Browser: Chrome 版本号
        Python: 3.14.x
        Node.js: 24.x
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 可选。请先删除密钥、令牌、私人正文和其他敏感内容。
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏
      description: 可选。可以把图片或视频拖放到此处；上传前请遮盖敏感信息。

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有找到相同问题。
          required: true
        - label: 我已删除日志和截图中的敏感信息。
          required: true
